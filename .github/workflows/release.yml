name: Release Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Desktop Binary
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Desktop Application (Tauri v2)
        run: pnpm run build:desktop

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_name }}".StartsWith("v")) { "${{ github.ref_name }}".TrimStart("v") } else { "${{ inputs.version }}" }
          $distDir = "release-artifacts"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          # Copy standalone portable executable
          $portableExe = "src-tauri/target/release/random-user-generator.exe"
          if (Test-Path $portableExe) {
            Copy-Item $portableExe "$distDir/random-user-generator-v$version-portable.exe"
          }

          # Copy NSIS setup installer
          $nsisExes = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          foreach ($file in $nsisExes) {
            Copy-Item $file.FullName "$distDir/random-user-generator-v$version-setup.exe"
          }

          # Copy MSI installer
          $msiFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          foreach ($file in $msiFiles) {
            Copy-Item $file.FullName "$distDir/random-user-generator-v$version-installer.msi"
          }

          # Generate SHA256 checksums
          Get-ChildItem -Path "$distDir/*.*" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$distDir/checksums-sha256.txt" -Append -Encoding utf8
          }

          Get-ChildItem -Path $distDir

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', inputs.version) }}
          name: Release ${{ github.ref_name || format('v{0}', inputs.version) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
