[package]
name = "random-user-generator"
version = "1.0.0"
description = "High-performance offline & online Random User Generator desktop application in Tauri v2 and Rust"
authors = ["Tuquet Team"]
license = "MIT"
repository = "https://github.com/tuquet/random-user-generator"
readme = "README.md"
edition = "2021"

[lib]
name = "random_user_generator_lib"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "random-user-generator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
rfd = "0.15"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
